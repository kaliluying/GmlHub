name = "gmlhub-one-ip"
main = "server/one-ip-worker.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "gmlhub.top/one-ip", zone_name = "gmlhub.top" },
  { pattern = "gmlhub.top/one-ip/*", zone_name = "gmlhub.top" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = true

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ICON_LIMITER"
namespace_id = "1003"
simple = { limit = 180, period = 60 }
