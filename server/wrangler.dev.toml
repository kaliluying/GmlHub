name = "gmlhub-network-local"
main = "one-ip-worker.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[vars]
LOCAL_DEV = "true"

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ICON_LIMITER"
namespace_id = "1003"
simple = { limit = 180, period = 60 }
